<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ocean Region Texture Preview</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #5f6f86;
        --line: #d9e2ef;
        --panel: #ffffff;
        --wash: #f5f8fc;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--wash);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 40px;
      }

      header {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      a,
      button {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        cursor: pointer;
        font: inherit;
        padding: 9px 12px;
        text-decoration: none;
      }

      .preview-card {
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--panel);
        box-shadow: 0 14px 40px rgba(23, 32, 51, 0.08);
      }

      #texture-preview,
      #texture-preview img {
        display: block;
        width: 100%;
      }

      #texture-preview img {
        height: auto;
        aspect-ratio: 2 / 1;
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        margin-top: 16px;
      }

      .region {
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 10px 12px;
      }

      .swatch {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
        border: 1px solid rgba(23, 32, 51, 0.18);
        border-radius: 50%;
      }

      .region strong {
        display: block;
        font-size: 14px;
      }

      .region span {
        display: block;
        color: var(--muted);
        font-size: 12px;
      }

      @media (max-width: 720px) {
        header {
          align-items: stretch;
          flex-direction: column;
        }

        nav {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Ocean Region Texture Preview</h1>
          <p>Flat 2:1 PNG texture used by the Continents and Oceans globe.</p>
        </div>
        <nav aria-label="Preview links">
          <a id="raw-svg-link" href="assets/maps/oceans/ocean-regions.png">Open PNG</a>
          <a href="maplibre-poc.html?activity=continents-oceans">Open globe</a>
        </nav>
      </header>

      <section class="preview-card" aria-label="Editable flat ocean texture">
        <div id="texture-preview"></div>
      </section>

      <section id="legend" class="meta" aria-label="Ocean region colors"></section>
    </main>

    <script type="module" src="src/maplibre/ocean-texture-preview.js?v=global-ocean-png"></script>
  </body>
</html>
