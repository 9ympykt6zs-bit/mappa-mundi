<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Geography Memory App - MapLibre Globe POC</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="maplibre-poc.css" />
  </head>
  <body class="overview-mode">
    <header class="poc-header">
      <div>
        <p class="eyebrow">MapLibre GL JS proof of concept</p>
        <h1 id="poc-title">World View</h1>
        <p id="poc-instruction">Choose a study region from the globe or the list below.</p>
      </div>
      <nav class="poc-nav" aria-label="Prototype navigation">
        <a href="index.html">Current SVG app</a>
        <button id="world-view-button" type="button">World View</button>
      </nav>
    </header>

    <main class="poc-main">
      <section class="map-shell" aria-label="Interactive MapLibre map">
        <div id="map"></div>
        <div class="zoom-panel" aria-label="Map zoom controls">
          <button id="fit-map-button" type="button" title="Fit map">Fit</button>
          <input id="zoom-slider" type="range" min="1" max="10" step="0.1" value="1.25" aria-label="Map zoom" />
        </div>
        <div class="map-overlay-card" id="study-card" hidden>
          <strong>States and Capitals 2</strong>
          <span>Cumulative Northeast proof sheet</span>
        </div>
      </section>

      <section id="region-panel" class="region-panel" aria-label="Study regions">
        <div>
          <h2>Study Regions</h2>
          <p>Start with the globe, then zoom into a focused practice map.</p>
        </div>
        <div class="region-list">
          <button type="button" data-region="united-states">
            <strong>United States</strong>
            <span>States and Capitals 8</span>
          </button>
          <button type="button" data-region="united-states" data-activity-id="us-states-capitals-01">
            <strong>States and Capitals 1</strong>
            <span>First Northeast section</span>
          </button>
          <button type="button" data-region="united-states" data-activity-id="us-states-capitals-02">
            <strong>States and Capitals 2</strong>
            <span>Second Northeast section</span>
          </button>
          <button type="button" data-region="united-states" data-activity-id="us-states-capitals-03">
            <strong>States and Capitals 3</strong>
            <span>Mid-Atlantic section</span>
          </button>
          <button type="button" data-region="united-states" data-activity-id="us-states-capitals-04">
            <strong>States and Capitals 4</strong>
            <span>Southeast section</span>
          </button>
          <button type="button" data-region="united-states" data-activity-id="us-states-capitals-05">
            <strong>States and Capitals 5</strong>
            <span>Great Lakes section</span>
          </button>
          <button type="button" data-region="united-states" data-activity-id="us-states-capitals-06">
            <strong>States and Capitals 6</strong>
            <span>Midwest section</span>
          </button>
          <button type="button" data-region="united-states" data-activity-id="us-states-capitals-07">
            <strong>States and Capitals 7</strong>
            <span>Northern Plains section</span>
          </button>
          <button type="button" data-region="united-states" data-activity-id="us-states-capitals-08">
            <strong>States and Capitals 8</strong>
            <span>Southwest section</span>
          </button>
          <button type="button" disabled>
            <strong>Western Europe</strong>
            <span>Use the current SVG app for now</span>
          </button>
          <button type="button" disabled>
            <strong>Continents / Oceans</strong>
            <span>Coming later</span>
          </button>
        </div>
      </section>
    </main>

    <section id="answer-panel" class="answer-panel" aria-label="Answer bank">
      <div class="status-row">
        <div>
          <h2>Answer Bank</h2>
          <p id="feedback" class="feedback" aria-live="polite"></p>
        </div>
        <div class="study-mode-toggle" role="group" aria-label="Study mode">
          <button class="active" type="button" data-study-mode="cumulative">Cumulative Review</button>
          <button type="button" data-study-mode="sectionOnly">Section Only</button>
        </div>
        <div class="progress-actions">
          <strong id="progress">0 of 20 completed</strong>
          <button id="reset-button" type="button">Reset</button>
        </div>
      </div>
      <div id="answer-bank" class="answer-bank"></div>
    </section>

    <script src="https://unpkg.com/maplibre-gl@5.18.0/dist/maplibre-gl.js"></script>
    <script type="module" src="src/maplibre-poc.js"></script>
  </body>
</html>
