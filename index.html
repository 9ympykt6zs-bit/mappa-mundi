<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0.2; url=maplibre-poc.html" />
    <title>Atlas Quest</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #e8f1f6;
        color: #172033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, #f7fbff 0%, #e8f1f6 100%);
      }

      main {
        width: min(560px, calc(100vw - 32px));
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid #d9e1ec;
        border-radius: 12px;
        box-shadow: 0 16px 34px rgba(24, 38, 64, 0.12);
        padding: 24px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.6rem;
      }

      p {
        margin: 0 0 16px;
        color: #536277;
      }

      .links {
        display: grid;
        gap: 10px;
      }

      a {
        background: #ffffff;
        border: 1px solid #bdc9d8;
        border-radius: 8px;
        color: #172033;
        display: inline-flex;
        justify-content: center;
        padding: 12px 14px;
        text-decoration: none;
        font-weight: 700;
      }

      a.primary {
        border-color: #2563eb;
        background: #edf4ff;
        color: #174ea6;
      }
    </style>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(() => {
          window.location.replace("maplibre-poc.html");
        }, 200);
      });
    </script>
  </head>
  <body>
    <main>
      <h1>Atlas Quest</h1>
      <p>Opening the globe app.</p>
      <div class="links">
        <a class="primary" href="maplibre-poc.html">Open Atlas Quest</a>
        <a href="legacy-svg-app.html">Open Legacy SVG App</a>
      </div>
    </main>
  </body>
</html>
